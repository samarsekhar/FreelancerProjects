<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftUI-Style Text Animation</title>
  <style>
    :root {
      --bg-color: #0b0b0c;
      --card-bg: #1c1c1e;
      --accent-color: #007aff;
      --text-color: #ffffff;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-center: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .swiftui-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      text-align: center;
      width: 280px;
    }

    /* Ticker Wrapper mimicking SwiftUI Content Transition Frame */
    .ticker-view {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1em;
      height: 1em;
      overflow: hidden;
      display: inline-flex;
      justify-content: center;
      margin: 20px 0;
    }

    /* Single Column for Digits */
    .digit-column {
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); /* Custom Spring-like Easing */
      height: 1em;
    }

    .digit-column span {
      height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SwiftUI Style Buttons */
    .btn-group {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.96);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="swiftui-card">
    <div style="font-size: 0.9rem; color: #8e8e93; font-weight: 500;">SWIFTUI TEXT TRANSITION</div>
    
    <!-- The Animating Text View Wrapper -->
    <div class="ticker-view" id="counter"></div>

    <div class="btn-group">
      <button onclick="updateCounter(-1)">−</button>
      <button onclick="updateCounter(1)">+</button>
    </div>
  </div>

  <script>
    let currentValue = 42;
    const counterContainer = document.getElementById('counter');

    // Initialize the ticker layout
    function initTicker(value) {
      counterContainer.innerHTML = '';
      const digits = String(value).split('');
      
      digits.forEach(digit => {
        const column = document.createElement('div');
        column.className = 'digit-column';
        
        // Generate values 0-9 inside the column strip
        for (let i = 0; i <= 9; i++) {
          const span = document.createElement('span');
          span.textContent = i;
          column.appendChild(span);
        }
        
        counterContainer.appendChild(column);
      });
      
      renderDigits(value, false);
    }

    // Apply the CSS Transform to animate the strip to the targeted index
    function renderDigits(value, animate = true) {
      const digits = String(value).padStart(counterContainer.children.length, '0').split('');
      
      Array.from(counterContainer.children).forEach((column, index) => {
        const targetDigit = parseInt(digits[index], 10);
        const yOffset = targetDigit * -100; // Shift down based on percentage height
        
        if (!animate) {
          column.style.transition = 'none';
        } else {
          column.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; // Soft spring curve
        }
        
        column.style.transform = `translateY(${yOffset}%)`;
      });
    }

    // Explicit state mutation triggering the UI update (SwiftUI pattern)
    function updateCounter(amount) {
      const newValue = currentValue + amount;
      if (newValue >= 0 && newValue <= 99) { // Boundary limits for 2-digit sample
        currentValue = newValue;
        renderDigits(currentValue);
      }
    }

    // Bootstrapping the initial state
    initTicker(currentValue);
  </script>
</body>
</html>
