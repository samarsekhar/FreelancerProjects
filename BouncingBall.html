<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Bouncing Ball</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      font-family: system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: 200px;
      height: 320px;
    }

    .ball {
      position: absolute;
      left: 50%;
      top: 0;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c);
      animation: bounce 1.1s cubic-bezier(0.5, 0, 1, 0.5) infinite alternate;
    }

    .shadow {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 60px;
      height: 14px;
      margin-left: -30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      filter: blur(2px);
      animation: shrink 1.1s cubic-bezier(0.5, 0, 1, 0.5) infinite alternate;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #7dd3fc;
    }

    @keyframes bounce {
      from {
        top: 0;
      }

      to {
        top: 260px;
      }
    }

    @keyframes shrink {
      from {
        transform: scale(0.6);
        opacity: 0.3;
      }

      to {
        transform: scale(1);
        opacity: 0.6;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="ball" id="ball"></div>
    <div class="shadow" id="shadow"></div>
  </div>
  <div class="controls">
    <button id="toggleBtn">Pause</button>
    <button id="colorBtn">Change Color</button>
  </div>
  <script>
    const ball = document.getElementById('ball');
    const shadow = document.getElementById('shadow');
    const toggleBtn = document.getElementById('toggleBtn');
    const colorBtn = document.getElementById('colorBtn');

    let running = true;
    const colors = [
      ['#f87171', '#b91c1c'],
      ['#34d399', '#047857'],
      ['#fbbf24', '#b45309'],
      ['#a78bfa', '#5b21b6'],
      ['#38bdf8', '#0369a1'],
    ];
    let colorIndex = 0;

    toggleBtn.addEventListener('click', () => {
      running = !running;
      const state = running ? 'running' : 'paused';
      ball.style.animationPlayState = state;
      shadow.style.animationPlayState = state;
      toggleBtn.textContent = running ? 'Pause' : 'Play';
    });

    colorBtn.addEventListener('click', () => {
      colorIndex = (colorIndex + 1) % colors.length;
      const [light, dark] = colors[colorIndex];
      ball.style.background = `radial-gradient(circle at 30% 30%, ${light}, ${dark})`;
    });
  </script>
</body>

</html>
