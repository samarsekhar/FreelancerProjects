<!-- Button to Folding Paper Plane Transition -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Button Animation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        html {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Inter", Arial, sans-serif;

            /* background: #e1e6f9; */
            background: #000
        }


        /* =========================
   BUTTON
========================= */

        .button {
            --primary: #275efe;
            --primary-dark: #2055ee;
            --primary-darkest: #133fc0;

            --text: #ffffff;
            --text-opacity: 1;

            --success: #2b3044;
            --success-scale: 0.2;
            --success-opacity: 0;

            --border-radius: 7;
            --rotate: 0;

            --plane-x: 0;
            --plane-y: 0;
            --plane-opacity: 1;

            /* Left wing */
            --left-wing-background: var(--primary);

            --left-wing-first-x: 0;
            --left-wing-first-y: 0;

            --left-wing-second-x: 50;
            --left-wing-second-y: 0;

            --left-wing-third-x: 0;
            --left-wing-third-y: 100;

            /* Left body */
            --left-body-background: var(--primary);

            --left-body-first-x: 50;
            --left-body-first-y: 0;

            --left-body-second-x: 50;
            --left-body-second-y: 100;

            --left-body-third-x: 0;
            --left-body-third-y: 100;

            /* Right wing */
            --right-wing-background: var(--primary);

            --right-wing-first-x: 50;
            --right-wing-first-y: 0;

            --right-wing-second-x: 100;
            --right-wing-second-y: 0;

            --right-wing-third-x: 100;
            --right-wing-third-y: 100;

            /* Right body */
            --right-body-background: var(--primary);

            --right-body-first-x: 50;
            --right-body-first-y: 0;

            --right-body-second-x: 50;
            --right-body-second-y: 100;

            --right-body-third-x: 100;
            --right-body-third-y: 100;

            position: relative;

            display: block;

            min-width: 100px;
            margin: 0;
            padding: 8px 0;

            border: 0;

            background: none;

            color: var(--text);

            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            line-height: 24px;

            text-align: center;

            cursor: pointer;

            outline: none;

            transform:
                rotate(calc(var(--rotate) * 1deg)) translateZ(0);

            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================
   LEFT / RIGHT PLANES
========================= */

        .button .left,
        .button .right {
            position: absolute;

            left: 0;
            top: 0;
            right: 0;
            bottom: 0;

            opacity: var(--plane-opacity);

            transform:
                translate(calc(var(--plane-x) * 1px),
                    calc(var(--plane-y) * 1px)) translateZ(0);
        }


        /* =========================
   COMMON SHAPES
========================= */

        .button .left::before,
        .button .left::after,
        .button .right::before,
        .button .right::after {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            right: 0;
            bottom: 0;

            border-radius: calc(var(--border-radius) * 1px);

            transform:
                translate(var(--x, 0.4%),
                    var(--y, 0)) translateZ(0);

            z-index: var(--z-index, 2);

            background: var(--background,
                    var(--left-wing-background));

            clip-path: polygon(calc(var(--first-x, var(--left-wing-first-x)) * 1%) calc(var(--first-y, var(--left-wing-first-y)) * 1%),

                    calc(var(--second-x, var(--left-wing-second-x)) * 1%) calc(var(--second-y, var(--left-wing-second-y)) * 1%),

                    calc(var(--third-x, var(--left-wing-third-x)) * 1%) calc(var(--third-y, var(--left-wing-third-y)) * 1%));
        }


        /* =========================
   LEFT
========================= */

        .button .left::after {
            --x: 0;
            --z-index: 1;

            --background: var(--left-body-background);

            --first-x: var(--left-body-first-x);
            --first-y: var(--left-body-first-y);

            --second-x: var(--left-body-second-x);
            --second-y: var(--left-body-second-y);

            --third-x: var(--left-body-third-x);
            --third-y: var(--left-body-third-y);
        }


        /* =========================
   RIGHT
========================= */

        .button .right::before {
            --x: -0.4%;
            --z-index: 2;

            --background: var(--right-wing-background);

            --first-x: var(--right-wing-first-x);
            --first-y: var(--right-wing-first-y);

            --second-x: var(--right-wing-second-x);
            --second-y: var(--right-wing-second-y);

            --third-x: var(--right-wing-third-x);
            --third-y: var(--right-wing-third-y);
        }

        .button .right::after {
            --x: 0;
            --z-index: 1;

            --background: var(--right-body-background);

            --first-x: var(--right-body-first-x);
            --first-y: var(--right-body-first-y);

            --second-x: var(--right-body-second-x);
            --second-y: var(--right-body-second-y);

            --third-x: var(--right-body-third-x);
            --third-y: var(--right-body-third-y);
        }


        /* =========================
   TEXT
========================= */

        .button span {
            position: relative;

            display: block;

            z-index: 4;

            opacity: var(--text-opacity);
        }


        /* SUCCESS TEXT */

        .button .success {
            position: absolute;

            left: 0;
            right: 0;
            top: 8px;

            z-index: 0;

            color: var(--success);

            opacity: var(--success-opacity);

            transform:
                rotate(calc(var(--rotate) * -1deg)) scale(var(--success-scale)) translateZ(0);
        }
    </style>
</head>

<body>

    <button class="button">
        <span class="default">Send</span>
        <span class="success">Sent</span>

        <div class="left"></div>
        <div class="right"></div>
    </button>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script>
        document.querySelectorAll(".button").forEach((button) => {

            const getVar = (variable) => {
                return getComputedStyle(button)
                    .getPropertyValue(variable);
            };


            button.addEventListener("click", () => {

                // Prevent clicking while animation is running
                if (button.classList.contains("active")) {
                    return;
                }

                button.classList.add("active");


                /* =========================
                   WING / PLANE ANIMATION
                ========================= */

                gsap.to(button, {

                    keyframes: [

                        {
                            "--left-wing-first-x": 50,
                            "--left-wing-first-y": 100,

                            "--right-wing-second-x": 50,
                            "--right-wing-second-y": 100,

                            duration: 0.2,

                            onComplete() {

                                gsap.set(button, {

                                    "--left-wing-first-y": 0,

                                    "--left-wing-second-x": 40,
                                    "--left-wing-second-y": 100,

                                    "--left-wing-third-x": 0,
                                    "--left-wing-third-y": 100,

                                    "--left-body-third-x": 40,

                                    "--right-wing-first-x": 50,
                                    "--right-wing-first-y": 0,

                                    "--right-wing-second-x": 60,
                                    "--right-wing-second-y": 100,

                                    "--right-wing-third-x": 100,
                                    "--right-wing-third-y": 100,

                                    "--right-body-third-x": 60
                                });
                            }
                        },


                        {
                            "--left-wing-third-x": 20,
                            "--left-wing-third-y": 90,

                            "--left-wing-second-y": 90,

                            "--left-body-third-y": 90,

                            "--right-wing-third-x": 80,
                            "--right-wing-third-y": 90,

                            "--right-body-third-y": 90,

                            "--right-wing-second-y": 90,

                            duration: 0.2
                        },


                        {
                            "--rotate": 50,

                            "--left-wing-third-y": 95,
                            "--left-wing-third-x": 27,

                            "--right-body-third-x": 45,

                            "--right-wing-second-x": 45,

                            "--right-wing-third-x": 60,
                            "--right-wing-third-y": 83,

                            duration: 0.25
                        },


                        {
                            "--rotate": 55,

                            "--plane-x": -8,
                            "--plane-y": 24,

                            duration: 0.2
                        },


                        {
                            "--rotate": 40,

                            "--plane-x": 45,
                            "--plane-y": -180,

                            "--plane-opacity": 0,

                            duration: 0.3,

                            onComplete() {

                                setTimeout(() => {

                                    // Reset button styles
                                    button.removeAttribute("style");


                                    // Fade button back in
                                    gsap.fromTo(
                                        button,

                                        {
                                            opacity: 0,
                                            y: -8
                                        },

                                        {
                                            opacity: 1,
                                            y: 0,

                                            clearProps: true,

                                            duration: 0.3,

                                            onComplete() {
                                                button.classList.remove("active");
                                            }
                                        }
                                    );

                                }, 2000);
                            }
                        }

                    ]
                });


                /* =========================
                   TEXT / COLOR ANIMATION
                ========================= */

                gsap.to(button, {

                    keyframes: [

                        {
                            "--text-opacity": 0,

                            "--border-radius": 0,

                            "--left-wing-background":
                                getVar("--primary-darkest"),

                            "--right-wing-background":
                                getVar("--primary-darkest"),

                            duration: 0.1
                        },


                        {
                            "--left-wing-background":
                                getVar("--primary"),

                            "--right-wing-background":
                                getVar("--primary"),

                            duration: 0.1
                        },


                        {
                            "--left-body-background":
                                getVar("--primary-dark"),

                            "--right-body-background":
                                getVar("--primary-darkest"),

                            duration: 0.4
                        },


                        {
                            "--success-opacity": 1,

                            "--success-scale": 1,

                            duration: 0.25,

                            delay: 0.25
                        }

                    ]
                });

            });

        });
    </script>
</body>

</html>
