<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Circular Loaders</title>
    <style>
      @property --p {
  syntax: "<integer>";
  initial-value: 0;
  inherits: true;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body,
.loader {
  display: grid;
}

html,
body {
  min-height: 100%;
}

body {
  min-height: 100vh;
  background: #222;
  grid-auto-flow: row;
  gap: 30px;
  padding: 30px;
}

/* Loader */
.loader {
  --p: 0;
  --r-pad: 6em;
  --b: calc(var(--r-pad) / 3);
  --w-rng: calc(0.125 * var(--b));

  place-self: center;
  position: relative;
  clip-path: circle(49%);
  animation: progress 10s steps(100) infinite;
  color: hsl(calc(var(--p) * 2), 100%, 65%);
}

/* Circular progress design */
.loader::before,
.loader::after {
  grid-row: 1;
  grid-column: 1;
}

/* Circle segments */
.loader::before {
  content: "";
  border: solid var(--b) transparent;
  padding: var(--r-pad);
  border-radius: 50%;

  box-shadow: inset 0 0 0 calc(2 * var(--w-rng)) currentColor;

  --slice: calc(360deg / var(--n));
  --s-gap: calc(var(--f) * var(--slice));
  --solid: calc((1 - var(--f)) * var(--slice));

  background: repeating-conic-gradient(
      from calc(0.5 * var(--s-gap)),
      currentColor 0% var(--solid),
      transparent 0% var(--slice)
    )
    border-box;

  filter: blur(0.5px);

  mask:
    conic-gradient(red 0% calc(var(--p) * 1%), rgba(255, 0, 0, 0.3) 0%)
      intersect,
    linear-gradient(red, red) border-box subtract,
    radial-gradient(
      red 0% calc(var(--r-pad) - 2 * var(--w-rng)),
      transparent calc(var(--r-pad) - 2 * var(--w-rng) + 1px)
        calc(var(--r-pad) - var(--w-rng) - 1px),
      red calc(var(--r-pad) - var(--w-rng)) calc(var(--r-pad) + 1px),
      transparent calc(var(--r-pad) + 2px)
    );
}

/* Percentage text */
.loader::after {
  content: counter(p) "%";
  place-self: center;

  counter-reset: p var(--p);

  font-family: Consolas, Monaco, monospace;
  font-size: calc(0.625 * var(--r-pad));
  font-weight: bold;
}

/* Progress animation */
@keyframes progress {
  90%,
  100% {
    --p: 100;
  }
}

/* Responsive layout */
@media (orientation: landscape) {
  body {
    grid-auto-flow: column;
    align-items: center;
  }
}

    </style>
  </head>
  <body>
    <div class="loader" style="--n: 1; --f: 0"></div>
    <div class="loader" style="--n: 16; --f: 0.2"></div>
    <div class="loader" style="--n: 24; --f: 0.3"></div>
  </body>
</html>
