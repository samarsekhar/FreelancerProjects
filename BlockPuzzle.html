<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retro Block Puzzle</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

/* Retro Game Container */

.game-wrapper {
    display: flex;
    gap: 25px;
    padding: 25px;
    border: 5px solid #555;
    background: #222;
    box-shadow:
        0 0 20px #000,
        inset 0 0 20px #000;
}

/* Game Board */

.game-container {
    position: relative;
}

canvas {
    display: block;
    background: #000;
    border: 5px solid #777;
    box-shadow: inset 0 0 20px #000;
}

/* Side Panel */

.panel {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.logo {
    font-size: 24px;
    text-align: center;
    color: #00ffcc;
    text-shadow: 0 0 10px #00ffcc;
}

.info-box {
    background: #111;
    border: 3px solid #555;
    padding: 15px;
    text-align: center;
}

.info-box h3 {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 8px;
}

.info-box span {
    font-size: 25px;
    color: #00ffcc;
}

/* Next Piece */

#next {
    background: #000;
    border: 3px solid #555;
}

/* Button */

button {
    padding: 12px;
    border: 3px solid #00ffcc;
    background: #111;
    color: #00ffcc;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    background: #00ffcc;
    color: black;
}

/* Mobile Controls */

.controls {
    display: none;
    margin-top: 20px;
    text-align: center;
}

.controls button {
    width: 65px;
    height: 55px;
    margin: 4px;
    font-size: 22px;
}

/* Responsive */

@media(max-width: 700px) {

    body {
        align-items: flex-start;
        padding-top: 15px;
    }

    .game-wrapper {
        flex-direction: column;
        align-items: center;
        padding: 15px;
    }

    .panel {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
    }

    .logo {
        grid-column: span 3;
    }

    #next {
        width: 100%;
    }

    .controls {
        display: block;
    }

    canvas {
        max-width: 90vw;
        height: auto;
    }
}

</style>
</head>

<body>

<div class="game-wrapper">

<div class="game-container">

<canvas id="game" width="300" height="600"></canvas>

<div class="controls">

<div>
<button onclick="move(-1)">⬅</button>
<button onclick="rotatePiece()">🔄</button>
<button onclick="move(1)">➡</button>
</div>

<div>
<button onclick="drop()">⬇</button>
<button onclick="hardDrop()">⏬</button>
</div>

</div>

</div>


<div class="panel">

<h1 class="logo">BLOCK<br>PUZZLE</h1>

<div class="info-box">
<h3>SCORE</h3>
<span id="score">0</span>
</div>

<div class="info-box">
<h3>LEVEL</h3>
<span id="level">1</span>
</div>

<div class="info-box">
<h3>LINES</h3>
<span id="lines">0</span>
</div>

<div class="info-box">

<h3>NEXT</h3>

<canvas id="next" width="150" height="120"></canvas>

</div>

<button onclick="restartGame()">RESTART GAME</button>

</div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");


/* =========================
   SETTINGS
========================= */

const COLS = 10;
const ROWS = 20;
const BLOCK = 30;


/* =========================
   GAME BOARD
========================= */

let board = Array.from(
    { length: ROWS },
    () => Array(COLS).fill(0)
);


/* =========================
   COLORS
========================= */

const colors = [
    null,
    "#00ffff",
    "#ffff00",
    "#aa00ff",
    "#00ff00",
    "#ff0000",
    "#0066ff",
    "#ff8800"
];


/* =========================
   TETROMINO SHAPES
========================= */

const shapes = [

[
[1,1,1,1]
],

[
[2,2],
[2,2]
],

[
[0,3,0],
[3,3,3]
],

[
[0,4,4],
[4,4,0]
],

[
[5,5,0],
[0,5,5]
],

[
[6,0,0],
[6,6,6]
],

[
[0,0,7],
[7,7,7]
]

];


/* =========================
   GAME VARIABLES
========================= */

let score = 0;
let level = 1;
let lines = 0;

let current;
let nextPiece;

let gameOver = false;

let dropCounter = 0;
let dropInterval = 800;

let lastTime = 0;


/* =========================
   CREATE PIECE
========================= */

function createPiece() {

    const index =
        Math.floor(Math.random() * shapes.length);

    return {

        matrix:
            shapes[index].map(row => [...row]),

        x:
            Math.floor(
                COLS / 2 -
                shapes[index][0].length / 2
            ),

        y: 0

    };

}


/* =========================
   DRAW BLOCK
========================= */

function drawBlock(x, y, color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        x * BLOCK,
        y * BLOCK,
        BLOCK,
        BLOCK
    );

    ctx.strokeStyle = "#111";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        x * BLOCK,
        y * BLOCK,
        BLOCK,
        BLOCK
    );

    /* Retro Highlight */

    ctx.fillStyle =
        "rgba(255,255,255,0.25)";

    ctx.fillRect(
        x * BLOCK + 3,
        y * BLOCK + 3,
        BLOCK - 6,
        5
    );

}


/* =========================
   DRAW BOARD
========================= */

function drawBoard() {

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Grid */

    ctx.strokeStyle =
        "rgba(255,255,255,0.08)";

    for(let x = 0; x <= COLS; x++) {

        ctx.beginPath();

        ctx.moveTo(x * BLOCK, 0);

        ctx.lineTo(
            x * BLOCK,
            ROWS * BLOCK
        );

        ctx.stroke();

    }


    for(let y = 0; y <= ROWS; y++) {

        ctx.beginPath();

        ctx.moveTo(0, y * BLOCK);

        ctx.lineTo(
            COLS * BLOCK,
            y * BLOCK
        );

        ctx.stroke();

    }


    /* Fixed Blocks */

    board.forEach((row, y) => {

        row.forEach((value, x) => {

            if(value) {

                drawBlock(
                    x,
                    y,
                    colors[value]
                );

            }

        });

    });

}


/* =========================
   DRAW PIECE
========================= */

function drawPiece(piece) {

    piece.matrix.forEach(
        (row, y) => {

        row.forEach(
            (value, x) => {

            if(value) {

                drawBlock(
                    x + piece.x,
                    y + piece.y,
                    colors[value]
                );

            }

        });

    });

}


/* =========================
   COLLISION
========================= */

function collide(piece) {

    for(
        let y = 0;
        y < piece.matrix.length;
        y++
    ) {

        for(
            let x = 0;
            x < piece.matrix[y].length;
            x++
        ) {

            if(piece.matrix[y][x] !== 0) {

                let boardX =
                    x + piece.x;

                let boardY =
                    y + piece.y;


                if(

                    boardX < 0 ||

                    boardX >= COLS ||

                    boardY >= ROWS ||

                    (
                        boardY >= 0 &&

                        board[boardY][boardX]
                    )

                ) {

                    return true;

                }

            }

        }

    }

    return false;

}


/* =========================
   MERGE PIECE
========================= */

function mergePiece() {

    current.matrix.forEach(
        (row, y) => {

        row.forEach(
            (value, x) => {

            if(value) {

                let boardY =
                    y + current.y;

                let boardX =
                    x + current.x;

                if(boardY >= 0) {

                    board[boardY][boardX]
                        = value;

                }

            }

        });

    });

}


/* =========================
   CLEAR LINES
========================= */

function clearLines() {

    let cleared = 0;

    outer:

    for(
        let y = ROWS - 1;
        y >= 0;
        y--
    ) {

        for(
            let x = 0;
            x < COLS;
            x++
        ) {

            if(
                board[y][x] === 0
            ) {

                continue outer;

            }

        }


        const row =
            board.splice(y, 1)[0];

        board.unshift(
            Array(COLS).fill(0)
        );

        y++;

        cleared++;

    }


    if(cleared > 0) {

        lines += cleared;


        const points =
            [0,100,300,500,800];

        score +=
            points[cleared] * level;


        level =
            Math.floor(lines / 10) + 1;


        dropInterval =
            Math.max(
                150,
                800 -
                (level - 1) * 60
            );


        updateInfo();

    }

}


/* =========================
   UPDATE SCORE
========================= */

function updateInfo() {

    document
        .getElementById("score")
        .textContent = score;

    document
        .getElementById("level")
        .textContent = level;

    document
        .getElementById("lines")
        .textContent = lines;

}


/* =========================
   PLAYER DROP
========================= */

function drop() {

    if(gameOver) return;

    current.y++;

    if(collide(current)) {

        current.y--;

        mergePiece();

        clearLines();

        current = nextPiece;

        nextPiece =
            createPiece();

        drawNext();


        if(collide(current)) {

            gameOver = true;

        }

    }

    dropCounter = 0;

}


/* =========================
   HARD DROP
========================= */

function hardDrop() {

    if(gameOver) return;

    while(!collide(current)) {

        current.y++;

    }

    current.y--;

    mergePiece();

    clearLines();

    current = nextPiece;

    nextPiece =
        createPiece();

    drawNext();


    if(collide(current)) {

        gameOver = true;

    }

}


/* =========================
   MOVE
========================= */

function move(direction) {

    if(gameOver) return;

    current.x += direction;

    if(collide(current)) {

        current.x -= direction;

    }

}


/* =========================
   ROTATE
========================= */

function rotatePiece() {

    if(gameOver) return;

    const original =
        current.matrix;

    const rotated =
        current.matrix[0].map(
            (_, index) =>
                current.matrix.map(
                    row => row[index]
                ).reverse()
        );


    current.matrix =
        rotated;


    if(collide(current)) {

        current.matrix =
            original;

    }

}


/* =========================
   DRAW NEXT PIECE
========================= */

function drawNext() {

    nextCtx.clearRect(
        0,
        0,
        nextCanvas.width,
        nextCanvas.height
    );


    const size = 25;

    const matrix =
        nextPiece.matrix;


    matrix.forEach(
        (row, y) => {

        row.forEach(
            (value, x) => {

            if(value) {

                nextCtx.fillStyle =
                    colors[value];

                nextCtx.fillRect(
                    x * size + 30,
                    y * size + 20,
                    size,
                    size
                );


                nextCtx.strokeStyle =
                    "#111";

                nextCtx.strokeRect(
                    x * size + 30,
                    y * size + 20,
                    size,
                    size
                );

            }

        });

    });

}


/* =========================
   GAME OVER SCREEN
========================= */

function drawGameOver() {

    if(!gameOver) return;

    ctx.fillStyle =
        "rgba(0,0,0,0.75)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle = "#ff3333";

    ctx.font =
        "bold 30px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "16px Arial";

    ctx.fillText(
        "Press Restart",
        canvas.width / 2,
        canvas.height / 2 + 40
    );

}


/* =========================
   GAME LOOP
========================= */

function update(time = 0) {

    const delta =
        time - lastTime;

    lastTime = time;


    if(!gameOver) {

        dropCounter += delta;


        if(
            dropCounter >
            dropInterval
        ) {

            drop();

        }

    }


    drawBoard();

    drawPiece(current);

    drawGameOver();


    requestAnimationFrame(
        update
    );

}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    event => {

    if(event.key === "ArrowLeft") {

        move(-1);

    }

    else if(
        event.key === "ArrowRight"
    ) {

        move(1);

    }

    else if(
        event.key === "ArrowDown"
    ) {

        drop();

    }

    else if(
        event.key === "ArrowUp"
    ) {

        rotatePiece();

    }

    else if(
        event.code === "Space"
    ) {

        event.preventDefault();

        hardDrop();

    }

});



/* =========================
   RESTART GAME
========================= */

function restartGame() {

    board =
        Array.from(
            { length: ROWS },
            () =>
                Array(COLS).fill(0)
        );


    score = 0;

    level = 1;

    lines = 0;

    dropInterval = 800;

    gameOver = false;


    current =
        createPiece();

    nextPiece =
        createPiece();


    updateInfo();

    drawNext();

}


/* =========================
   START GAME
========================= */

current =
    createPiece();

nextPiece =
    createPiece();


drawNext();

updateInfo();

update();

</script>

</body>
</html>
