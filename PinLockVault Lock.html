<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vault Lock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg-deep:   #14101c;
    --bg-panel:  #1d1726;
    --gold:      #e8b34d;
    --gold-soft: #f0c876;
    --gold-dim:  rgba(232,179,77,0.16);
    --ink:       #f3ede0;
    --ink-dim:   #8d84a0;
    --err:       #e0556b;
    --ok:        #6fcf97;
    --radius:    26px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; height:100%;
    background: radial-gradient(circle at 50% 15%, #241b34 0%, var(--bg-deep) 55%, #0c0912 100%);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  /* ---- Phone frame ---- */
  .phone{
    position:relative;
    width:100%;
    max-width:360px;
    aspect-ratio: 9 / 19.2;
    max-height: 92vh;
    background: linear-gradient(180deg, #1a1424 0%, #120d1a 100%);
    border-radius:44px;
    border:1px solid rgba(232,179,77,0.15);
    box-shadow:
      0 0 0 8px #0a0710,
      0 30px 60px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.04);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 44px 26px 30px;
    overflow:hidden;
  }

  .notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:90px; height:22px; border-radius:14px;
    background:#0a0710;
  }

  .status-time{
    position:absolute; top:16px; left:32px;
    font-size:13px; letter-spacing:0.5px; color:var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Vault emblem / signature element ---- */
  .vault-wrap{
    margin-top: 6px;
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
  }

  .dial{
    width:76px; height:76px;
    border-radius:50%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 35% 30%, #2c2338, #17111f 70%);
    border:1.5px solid var(--gold-dim);
    box-shadow: 0 0 0 6px rgba(232,179,77,0.05), inset 0 2px 6px rgba(0,0,0,0.5);
    transition: transform .6s cubic-bezier(.2,.9,.3,1.2), box-shadow .4s ease, border-color .4s ease;
  }
  .dial::before{
    content:'';
    position:absolute; inset:10px;
    border-radius:50%;
    border:1px dashed rgba(232,179,77,0.25);
  }
  .dial svg{ width:30px; height:30px; position:relative; z-index:2; }
  .dial .shackle{
    transform-origin: 50% 70%;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  }
  .dial.unlocked .shackle{ transform: translateY(-3px) rotate(-28deg); }
  .dial.unlocked{
    border-color: var(--ok);
    box-shadow: 0 0 0 8px rgba(111,207,151,0.12), 0 0 24px rgba(111,207,151,0.35);
  }
  .dial.shake{ animation: shakeDial .45s ease; }
  .dial.shake{ border-color: var(--err); }
  @keyframes shakeDial{
    10%,90% { transform: translateX(-2px); }
    20%,80% { transform: translateX(4px); }
    30%,50%,70% { transform: translateX(-8px); }
    40%,60% { transform: translateX(8px); }
  }

  .title{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px; font-weight:600; letter-spacing:0.3px;
  }
  .subtitle{
    font-size:12.5px; color:var(--ink-dim); letter-spacing:0.2px;
    min-height:16px;
    transition: color .25s ease;
  }
  .subtitle.err{ color: var(--err); }
  .subtitle.ok{ color: var(--ok); }

  /* ---- PIN tumblers ---- */
  .tumblers{
    display:flex; gap:16px;
    margin: 28px 0 8px;
  }
  .tumbler{
    width:14px; height:14px;
    border-radius:50%;
    border:1.5px solid rgba(232,179,77,0.35);
    background: transparent;
    position:relative;
    transition: transform .18s ease, border-color .2s ease, background .2s ease;
  }
  .tumbler.filled{
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 70%);
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(232,179,77,0.55);
    transform: scale(1.12);
  }
  .tumblers.shake{ animation: shakeDial .45s ease; }
  .tumblers.shake .tumbler{ border-color: var(--err) !important; }
  .tumblers.shake .tumbler.filled{
    background: radial-gradient(circle at 35% 30%, #f0899a, var(--err) 70%);
    box-shadow: 0 0 10px rgba(224,85,107,0.55);
  }

  /* ---- Keypad ---- */
  .keypad{
    margin-top:auto;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:14px;
    width:100%;
  }

  .key{
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.06);
    background: linear-gradient(180deg, #241c31 0%, #1a1424 100%);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-size:22px; font-weight:500;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    cursor:pointer;
    user-select:none;
    transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
  }
  .key:active{
    transform: scale(0.92);
    background: linear-gradient(180deg, #2c2238 0%, #1f1729 100%);
  }
  .key .sub{
    position:absolute; bottom:9px; left:0; right:0;
    text-align:center; font-family:'Inter'; font-size:7.5px;
    letter-spacing:1.5px; color:var(--ink-dim); font-weight:600;
  }
  .key.ghost{ background:transparent; border:none; cursor:default; }
  .key.ghost:active{ transform:none; }
  .key.func svg{ width:20px; height:20px; opacity:0.75; }

  .ripple{
    position:absolute; inset:0; border-radius:50%;
    background: var(--gold-dim);
    opacity:0; transform:scale(0.6);
    pointer-events:none;
  }
  .key.pulse .ripple{
    animation: rippleGo .45s ease-out;
  }
  @keyframes rippleGo{
    0%{ opacity:0.9; transform:scale(0.5); }
    100%{ opacity:0; transform:scale(1.35); }
  }

  .hint{
    margin-top:16px;
    font-size:11px; color:var(--ink-dim);
    letter-spacing:0.3px;
    opacity:0.7;
  }

  @media (prefers-reduced-motion: reduce){
    .dial, .dial .shackle, .tumbler, .key, .ripple { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="status-time" id="clock">9:41</div>

    <div class="vault-wrap">
      <div class="dial" id="dial">
        <svg viewBox="0 0 24 24" fill="none">
          <path class="shackle" d="M7 10V7a5 5 0 0 1 10 0v3" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
          <rect x="5" y="10" width="14" height="10" rx="2.5" fill="var(--gold)"/>
        </svg>
      </div>
      <div class="title">Vault Locked</div>
      <div class="subtitle" id="subtitle">Enter your 4-digit code</div>
    </div>

    <div class="tumblers" id="tumblers">
      <div class="tumbler"></div>
      <div class="tumbler"></div>
      <div class="tumbler"></div>
      <div class="tumbler"></div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2<span class="sub">ABC</span></button>
      <button class="key" data-k="3">3<span class="sub">DEF</span></button>
      <button class="key" data-k="4">4<span class="sub">GHI</span></button>
      <button class="key" data-k="5">5<span class="sub">JKL</span></button>
      <button class="key" data-k="6">6<span class="sub">MNO</span></button>
      <button class="key" data-k="7">7<span class="sub">PQRS</span></button>
      <button class="key" data-k="8">8<span class="sub">TUV</span></button>
      <button class="key" data-k="9">9<span class="sub">WXYZ</span></button>
      <button class="key func ghost" data-k="bio" aria-label="Use biometrics">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 2a7 7 0 0 0-7 7v2c0 3-1 5-2 6M12 2a7 7 0 0 1 7 7v2c0 1.2.15 2.2.4 3M8 21c.7-1 1.4-2.7 1.6-4.6M12 6a5 5 0 0 0-5 5v1c0 4-1.5 6.5-2.7 8M12 6a5 5 0 0 1 5 5v1c0 1.7.2 3 .6 4.2M12 10a3 3 0 0 0-3 3c0 3-.6 5-1.3 6.5M12 10a3 3 0 0 1 3 3c0 1.8.3 4 1 5.7"/>
        </svg>
      </button>
      <button class="key" data-k="0">0</button>
      <button class="key func" data-k="del" aria-label="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
          <path d="M14 9l4 6M18 9l-4 6"/>
        </svg>
      </button>
    </div>

    <div class="hint">Demo code: 1234</div>
  </div>
</div>

<script>
(function(){
  const CODE = "1234";
  let entered = "";
  let locked = false;

  const tumblersEl = document.getElementById('tumblers');
  const tumblerNodes = tumblersEl.querySelectorAll('.tumbler');
  const dial = document.getElementById('dial');
  const subtitle = document.getElementById('subtitle');
  const keypad = document.getElementById('keypad');
  const clock = document.getElementById('clock');

  function updateClock(){
    const d = new Date();
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    clock.textContent = h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 15000);

  function renderTumblers(){
    tumblerNodes.forEach((t, i) => {
      t.classList.toggle('filled', i < entered.length);
    });
  }

  function setSubtitle(text, cls){
    subtitle.textContent = text;
    subtitle.className = 'subtitle' + (cls ? ' ' + cls : '');
  }

  function shakeAndReset(){
    tumblersEl.classList.add('shake');
    dial.classList.add('shake');
    setSubtitle('Incorrect code — try again', 'err');
    setTimeout(() => {
      tumblersEl.classList.remove('shake');
      dial.classList.remove('shake');
      entered = "";
      renderTumblers();
      setSubtitle('Enter your 4-digit code');
    }, 500);
  }

  function unlock(){
    locked = true;
    dial.classList.add('unlocked');
    setSubtitle('Vault unlocked', 'ok');
    keypad.querySelectorAll('.key').forEach(k => k.style.pointerEvents = 'none');
    setTimeout(() => {
      // reset demo after a beat so it can be tried again
      dial.classList.remove('unlocked');
      entered = "";
      renderTumblers();
      setSubtitle('Enter your 4-digit code');
      keypad.querySelectorAll('.key').forEach(k => k.style.pointerEvents = '');
      locked = false;
    }, 1800);
  }

  function pressDigit(d){
    if(locked || entered.length >= 4) return;
    entered += d;
    renderTumblers();
    if(entered.length === 4){
      setTimeout(() => {
        if(entered === CODE){ unlock(); }
        else { shakeAndReset(); }
      }, 150);
    }
  }

  function pressDelete(){
    if(locked) return;
    entered = entered.slice(0, -1);
    renderTumblers();
    setSubtitle('Enter your 4-digit code');
  }

  keypad.addEventListener('click', (e) => {
    const btn = e.target.closest('.key');
    if(!btn) return;
    const k = btn.dataset.k;

    // ripple pulse
    let ripple = btn.querySelector('.ripple');
    if(!ripple){
      ripple = document.createElement('span');
      ripple.className = 'ripple';
      btn.appendChild(ripple);
    }
    btn.classList.remove('pulse');
    void btn.offsetWidth;
    btn.classList.add('pulse');

    if(k === 'del'){ pressDelete(); return; }
    if(k === 'bio'){
      setSubtitle('Biometrics not set up in demo');
      return;
    }
    pressDigit(k);
  });

  document.addEventListener('keydown', (e) => {
    if(/^[0-9]$/.test(e.key)) pressDigit(e.key);
    if(e.key === 'Backspace') pressDelete();
  });
})();
</script>

</body>
</html>
