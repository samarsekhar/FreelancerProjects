<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Interactive Deadline Loader</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #312e81, transparent 35%),
        radial-gradient(circle at bottom right, #0f766e, transparent 35%),
        #020617;

      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 900px;

      padding: 30px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;

      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(20px);

      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: clamp(28px, 5vw, 46px);
      margin-bottom: 8px;

      background: linear-gradient(90deg, #818cf8, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #94a3b8;
      font-size: 15px;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      align-items: center;
    }

    /* =========================
       LOADER
    ========================= */

    .loader-section {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loader {
      --progress: 0deg;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;

      background:
        conic-gradient(#6366f1 var(--progress),
          #1e293b var(--progress));

      box-shadow:
        0 0 50px rgba(99, 102, 241, 0.25);

      transition: background 0.3s ease;
    }

    .loader::before {
      content: "";

      position: absolute;

      width: 245px;
      height: 245px;

      border-radius: 50%;

      background: #0f172a;

      box-shadow:
        inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .loader-content {
      position: relative;
      z-index: 2;

      text-align: center;
    }

    .percentage {
      font-size: 48px;
      font-weight: 800;

      margin-bottom: 5px;
    }

    .remaining-label {
      font-size: 11px;
      color: #64748b;

      letter-spacing: 2px;
    }

    .countdown {
      margin-top: 8px;

      font-size: 23px;
      font-weight: 700;

      color: #22d3ee;
    }

    .deadline-status {
      margin-top: 8px;

      font-size: 13px;
      color: #94a3b8;
    }

    /* =========================
       FORM
    ========================= */

    .controls {
      padding: 25px;

      border-radius: 20px;

      background: rgba(30, 41, 59, 0.7);

      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .controls h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 600;

      color: #cbd5e1;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #334155;
      border-radius: 12px;

      outline: none;

      background: #0f172a;
      color: white;

      font-size: 16px;

      transition: 0.2s;
    }

    input:focus {
      border-color: #6366f1;

      box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;

      margin-top: 22px;
    }

    button {
      flex: 1;

      min-width: 110px;

      padding: 13px 18px;

      border: none;
      border-radius: 12px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.2s,
        opacity 0.2s,
        box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .start-btn {
      background: #6366f1;
      color: white;

      box-shadow:
        0 8px 25px rgba(99, 102, 241, 0.3);
    }

    .pause-btn {
      background: #334155;
      color: white;
    }

    .reset-btn {
      background: #ef4444;
      color: white;
    }

    .status {
      min-height: 22px;

      margin-top: 18px;

      color: #94a3b8;

      font-size: 13px;

      line-height: 1.5;
    }

    /* =========================
       PROGRESS BAR
    ========================= */

    .progress-area {
      margin-top: 25px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 12px;
      color: #94a3b8;
    }

    .progress-bar {
      height: 8px;

      overflow: hidden;

      border-radius: 20px;

      background: #1e293b;
    }

    .progress-fill {
      width: 0%;

      height: 100%;

      border-radius: inherit;

      background: linear-gradient(90deg,
          #6366f1,
          #22d3ee);

      transition: width 0.3s linear;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 12px;
      }

      .container {
        padding: 20px;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .loader {
        width: 250px;
        height: 250px;
      }

      .loader::before {
        width: 205px;
        height: 205px;
      }

      .percentage {
        font-size: 40px;
      }

      .countdown {
        font-size: 20px;
      }

      .controls {
        padding: 20px;
      }
    }

    @media (max-width: 400px) {

      .container {
        padding: 15px;
      }

      .loader {
        width: 220px;
        height: 220px;
      }

      .loader::before {
        width: 180px;
        height: 180px;
      }

      .percentage {
        font-size: 34px;
      }

      .countdown {
        font-size: 18px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Deadline Loader</h1>

      <p>
        Set your deadline and watch the progress in real time.
      </p>
    </div>


    <div class="main">

      <!-- =====================
           LOADER
      ====================== -->

      <section class="loader-section">

        <div class="loader" id="loader" style="--progress: 0deg;">

          <div class="loader-content">

            <div class="percentage" id="percentage">
              0%
            </div>

            <div class="remaining-label">
              TIME REMAINING
            </div>

            <div class="countdown" id="countdown">
              --:--:--
            </div>

            <div class="deadline-status" id="deadlineStatus">
              Not started
            </div>

          </div>

        </div>

      </section>


      <!-- =====================
           CONTROLS
      ====================== -->

      <section class="controls">

        <h2>Set Deadline</h2>

        <div class="input-group">

          <label for="deadline">
            Deadline Date & Time
          </label>

          <input type="datetime-local" id="deadline">

        </div>


        <div class="input-group">

          <label for="duration">
            Duration Before Deadline (Hours)
          </label>

          <input type="number" id="duration" value="24" min="0.1" step="0.1">

        </div>


        <div class="buttons">

          <button class="start-btn" id="startBtn">
            ▶ Start
          </button>

          <button class="pause-btn" id="pauseBtn">
            ⏸ Pause
          </button>

          <button class="reset-btn" id="resetBtn">
            ↻ Reset
          </button>

        </div>


        <div class="status" id="status">
          Set a deadline and press Start.
        </div>


        <div class="progress-area">

          <div class="progress-info">

            <span>
              Progress
            </span>

            <span id="progressText">
              0%
            </span>

          </div>

          <div class="progress-bar">

            <div class="progress-fill" id="progressFill"></div>

          </div>

        </div>

      </section>

    </div>

  </div>


  <script>

    // =========================================
    // ELEMENTS
    // =========================================

    const loader =
      document.getElementById("loader");

    const percentage =
      document.getElementById("percentage");

    const countdown =
      document.getElementById("countdown");

    const deadlineStatus =
      document.getElementById("deadlineStatus");

    const deadlineInput =
      document.getElementById("deadline");

    const durationInput =
      document.getElementById("duration");

    const startBtn =
      document.getElementById("startBtn");

    const pauseBtn =
      document.getElementById("pauseBtn");

    const resetBtn =
      document.getElementById("resetBtn");

    const status =
      document.getElementById("status");

    const progressFill =
      document.getElementById("progressFill");

    const progressText =
      document.getElementById("progressText");


    // =========================================
    // VARIABLES
    // =========================================

    let timer = null;

    let startTime = 0;
    let endTime = 0;
    let totalDuration = 0;

    let isPaused = false;


    // =========================================
    // PAD NUMBER
    // =========================================

    function pad(number) {

      return String(
        Math.max(0, Math.floor(number))
      ).padStart(2, "0");

    }


    // =========================================
    // FORMAT TIME
    // =========================================

    function formatTime(milliseconds) {

      let seconds =
        Math.max(
          0,
          Math.floor(milliseconds / 1000)
        );

      const days =
        Math.floor(seconds / 86400);

      seconds %= 86400;

      const hours =
        Math.floor(seconds / 3600);

      seconds %= 3600;

      const minutes =
        Math.floor(seconds / 60);

      seconds %= 60;


      if (days > 0) {

        return `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

      }


      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

    }


    // =========================================
    // DEFAULT DEADLINE
    // =========================================

    function setDefaultDeadline() {

      const date =
        new Date(
          Date.now() + 24 * 60 * 60 * 1000
        );

      const offset =
        date.getTimezoneOffset();

      const localDate =
        new Date(
          date.getTime() -
          offset * 60000
        );

      deadlineInput.value =
        localDate
          .toISOString()
          .slice(0, 16);

    }


    // =========================================
    // UPDATE UI
    // =========================================

    function updateLoader() {

      if (!endTime) {
        return;
      }


      const now = Date.now();

      const remaining =
        endTime - now;


      const elapsed =
        now - startTime;


      let progress =
        (elapsed / totalDuration) * 100;


      progress =
        Math.min(
          100,
          Math.max(0, progress)
        );


      // Update percentage

      const roundedProgress =
        Math.round(progress);

      percentage.textContent =
        `${roundedProgress}%`;

      progressText.textContent =
        `${roundedProgress}%`;


      // Update circular loader

      loader.style.setProperty(
        "--progress",
        `${progress * 3.6}deg`
      );


      // Update progress bar

      progressFill.style.width =
        `${progress}%`;


      // Update countdown

      countdown.textContent =
        formatTime(remaining);


      // Deadline reached

      if (remaining <= 0) {

        clearInterval(timer);

        timer = null;

        percentage.textContent = "100%";

        progressText.textContent = "100%";

        countdown.textContent =
          "00:00:00";

        progressFill.style.width =
          "100%";

        loader.style.setProperty(
          "--progress",
          "360deg"
        );

        deadlineStatus.textContent =
          "Deadline reached!";

        status.textContent =
          "🎉 Your deadline has been reached.";

        isPaused = false;

        pauseBtn.textContent =
          "⏸ Pause";

        return;

      }


      // Status

      if (!isPaused) {

        deadlineStatus.textContent =
          "Countdown running...";

      }

    }


    // =========================================
    // START TIMER
    // =========================================

    function startTimer() {

      const deadlineValue =
        deadlineInput.value;

      const duration =
        Number(durationInput.value);


      // Validate deadline

      if (!deadlineValue) {

        status.textContent =
          "⚠ Please select a deadline.";

        return;

      }


      // Validate duration

      if (
        !Number.isFinite(duration) ||
        duration <= 0
      ) {

        status.textContent =
          "⚠ Duration must be greater than 0.";

        return;

      }


      const targetTime =
        new Date(
          deadlineValue
        ).getTime();


      if (
        !Number.isFinite(targetTime)
      ) {

        status.textContent =
          "⚠ Invalid deadline.";

        return;

      }


      // Check future deadline

      if (
        targetTime <= Date.now()
      ) {

        status.textContent =
          "⚠ Please select a future deadline.";

        return;

      }


      // Calculate values

      totalDuration =
        duration * 60 * 60 * 1000;

      endTime =
        targetTime;

      startTime =
        endTime - totalDuration;


      isPaused = false;


      // Clear old timer

      clearInterval(timer);


      // Start new timer

      timer =
        setInterval(
          updateLoader,
          250
        );


      pauseBtn.textContent =
        "⏸ Pause";

      status.textContent =
        "✓ Deadline countdown started.";

      deadlineStatus.textContent =
        "Countdown running...";


      updateLoader();

    }


    // =========================================
    // PAUSE / RESUME
    // =========================================

    function togglePause() {

      if (!endTime) {

        status.textContent =
          "Start the countdown first.";

        return;

      }


      if (!isPaused) {

        // Pause

        isPaused = true;

        clearInterval(timer);

        timer = null;

        pauseBtn.textContent =
          "▶ Resume";

        deadlineStatus.textContent =
          "Paused";

        status.textContent =
          "⏸ Countdown paused.";

      }

      else {

        // Resume

        if (
          endTime <= Date.now()
        ) {

          updateLoader();

          return;

        }


        isPaused = false;

        timer =
          setInterval(
            updateLoader,
            250
          );

        pauseBtn.textContent =
          "⏸ Pause";

        deadlineStatus.textContent =
          "Countdown running...";

        status.textContent =
          "▶ Countdown resumed.";

      }

    }


    // =========================================
    // RESET
    // =========================================

    function resetTimer() {

      clearInterval(timer);

      timer = null;

      startTime = 0;
      endTime = 0;
      totalDuration = 0;

      isPaused = false;


      percentage.textContent =
        "0%";

      progressText.textContent =
        "0%";

      countdown.textContent =
        "--:--:--";

      deadlineStatus.textContent =
        "Not started";

      progressFill.style.width =
        "0%";

      loader.style.setProperty(
        "--progress",
        "0deg"
      );

      pauseBtn.textContent =
        "⏸ Pause";

      status.textContent =
        "Set a deadline and press Start.";

      setDefaultDeadline();

    }


    // =========================================
    // EVENTS
    // =========================================

    startBtn.addEventListener(
      "click",
      startTimer
    );

    pauseBtn.addEventListener(
      "click",
      togglePause
    );

    resetBtn.addEventListener(
      "click",
      resetTimer
    );


    // =========================================
    // INITIALIZE
    // =========================================

    setDefaultDeadline();

  </script>

</body>

</html>
