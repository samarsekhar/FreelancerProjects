<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Slider Hover Effect | DeveloperSamarsekhar</title>
    <style>
      body {
  background: #5c75f6;
  display: flex;
  min-height: 100vh;
  justify-content: center;
  align-content: center;
  align-items: center;
}
.card {
  color: #1b1b1b;
  width: 190px;
  height: 254px;
  position: relative;
  outline: 6px solid #f5f5f5;
  border-radius: 8px;
  line-height: 150%;
  padding: 16px;
  background: #ff0f17;
  background-blend-mode: multiply;
  background: linear-gradient(to top, #ff0f17, #fd3636);
  transition: background-color 1s ease-in-out;
  overflow: hidden;
}

.card-front {
  bottom: 16px;
  left: 0;
  position: absolute;
  width: 100%;
  text-align: center;
  transition: transform 1s cubic-bezier(0.785, 0.135, 0.15, 0.86);
}

.card-back {
  transform: translateX(120%);
  transition: transform 1s cubic-bezier(0.785, 0.135, 0.15, 0.86);
}

/*Text*/
.title {
  font-size: 1.3rem;
  font-weight: bold;
  color: #f3eded;
}
.subtitle {
  font-size: 1.2rem;
  color: #f3eded;
}

/*Text divider*/
.title::after {
  content: "";
  display: block;
  width: 50%;
  border-radius: 50%;
  height: 2px;
  margin: 2px auto;
  background-color: #f3eded;
}

.card-back {
  position: absolute;
  top: 0;
  left: 0;
  width: 190px;
  height: 254px;
  background-color: #1b1b1b;
  color: #f3eded;
  padding: 16px;
}

/*Hover*/
/* .card:hover {
  background-color: #1b1b1b25;
} */

.card:hover .card-front {
  transform: translateX(-100%);
}

.card:hover .card-back {
  transform: translateX(0);
}

    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-front">
        <p class="title">Developer<br />Samarsekhar</p>
        <p class="subtitle">Subscribe</p>
      </div>
      <div class="card-back">
        <p>
          A passionate Full Stack Developer based in specializing in modern web
          applications.
        </p>
      </div>
    </div>
  </body>
</html>
