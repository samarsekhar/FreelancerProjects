<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Add to Cart Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
    }

    /* Product */
    .product {
      width: 220px;
      padding: 25px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    .product-image {
      width: 120px;
      height: 120px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
      background: #f1f1f1;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .product h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Button */
    .cart-btn {
      position: relative;
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      transition: 0.3s ease;
    }

    .cart-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .cart-btn:active {
      transform: scale(0.96);
    }

    .btn-text {
      position: relative;
      z-index: 2;
      transition: 0.3s;
    }

    /* Success state */
    .cart-btn.added {
      background: #19a463;
    }

    /* Cart */
    .cart {
      position: fixed;
      top: 30px;
      right: 35px;

      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;
      border-radius: 50%;

      font-size: 28px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);

      z-index: 10;
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;

      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ff3b30;
      color: white;

      font-size: 13px;
      font-weight: bold;

      border-radius: 50%;

      transform: scale(0);
    }

    .cart-count.show {
      animation: countPop 0.4s ease forwards;
    }

    @keyframes countPop {
      0% {
        transform: scale(0);
      }

      60% {
        transform: scale(1.3);
      }

      100% {
        transform: scale(1);
      }
    }

    /* Flying product */
    .flying-item {
      position: fixed;
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: white;

      border-radius: 12px;

      font-size: 25px;

      pointer-events: none;

      z-index: 100;

      transition:
        left 0.8s cubic-bezier(0.6, -0.05, 0.3, 1.2),
        top 0.8s cubic-bezier(0.6, -0.05, 0.3, 1.2),
        transform 0.8s ease,
        opacity 0.8s ease;
    }

    /* Cart shake */
    .cart.shake {
      animation: cartShake 0.5s ease;
    }

    @keyframes cartShake {
      0% {
        transform: rotate(0);
      }

      20% {
        transform: rotate(-12deg) scale(1.1);
      }

      40% {
        transform: rotate(12deg) scale(1.1);
      }

      60% {
        transform: rotate(-8deg);
      }

      80% {
        transform: rotate(8deg);
      }

      100% {
        transform: rotate(0) scale(1);
      }
    }
  </style>
</head>

<body>

  <!-- Cart -->
  <div class="cart" id="cart">
    🛒
    <span class="cart-count" id="cartCount">0</span>
  </div>

  <!-- Product -->
  <div class="container">

    <div class="product">

      <div class="product-image">
        👟
      </div>

      <h2>Running Shoes</h2>

      <div class="price">
        $89
      </div>

      <button class="cart-btn" id="addToCart">
        <span class="btn-text">Add to Cart</span>
      </button>

    </div>

  </div>


  <script>
    const button = document.getElementById("addToCart");
    const cart = document.getElementById("cart");
    const cartCount = document.getElementById("cartCount");
    const btnText = document.querySelector(".btn-text");

    let count = 0;

    button.addEventListener("click", () => {

      // Prevent multiple clicks during animation
      if (button.classList.contains("loading")) return;

      button.classList.add("loading");

      // Get button position
      const buttonRect = button.getBoundingClientRect();

      // Get cart position
      const cartRect = cart.getBoundingClientRect();

      // Create flying product
      const flyingItem = document.createElement("div");

      flyingItem.classList.add("flying-item");
      flyingItem.innerHTML = "👟";

      flyingItem.style.left =
        `${buttonRect.left + buttonRect.width / 2 - 22}px`;

      flyingItem.style.top =
        `${buttonRect.top + buttonRect.height / 2 - 22}px`;

      document.body.appendChild(flyingItem);


      // Small delay allows browser to render initial position
      requestAnimationFrame(() => {

        flyingItem.style.left =
          `${cartRect.left + cartRect.width / 2 - 22}px`;

        flyingItem.style.top =
          `${cartRect.top + cartRect.height / 2 - 22}px`;

        flyingItem.style.transform =
          "scale(0.3) rotate(360deg)";

        flyingItem.style.opacity = "0";

      });


      // Animation complete
      setTimeout(() => {

        flyingItem.remove();

        // Increase cart count
        count++;

        cartCount.textContent = count;

        cartCount.classList.remove("show");

        // Force reflow
        void cartCount.offsetWidth;

        cartCount.classList.add("show");

        // Shake cart
        cart.classList.remove("shake");

        void cart.offsetWidth;

        cart.classList.add("shake");

        // Button success state
        button.classList.add("added");

        btnText.textContent = "✓ Added to Cart";

      }, 800);


      // Reset button
      setTimeout(() => {

        button.classList.remove("loading");
        button.classList.remove("added");

        btnText.textContent = "Add to Cart";

      }, 1800);

    });
  </script>

</body>

</html>
